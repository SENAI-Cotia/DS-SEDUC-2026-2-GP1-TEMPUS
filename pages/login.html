<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina Inicial</title>
    <link rel="stylesheet" href="../styles/login.css">
</head>
<body>
      <div class="conteudo">
        <img class="logo" src="../img/logo.png">
        <button class="entrar">
            Entar
        </button>
        
        <button class="cadastrar">
            Cadastre-se
        </button>

        <div class="formulario">
            <label for="email">E-mail ou ID:</label>
            <input type="text" id="email" placeholder="Digite seu e-mail ou ID" />

            <label for="senha">Senha:</label>
            <input type="password" id="senha" placeholder="Digite seua senha">
        </div>
        
        <h3>Esqueceu a senha?</h3>
        <h4>Recupere seu login recebendo um código no seu email, <a href="#">clique aqui</a></h4>

        <button class="entrar-google"><img class="google" src="../img/google.png">Entrar com Google</button>

        <button class="entrar-final"><a href="#">Entrar</a></button>
    </div>
</body>
</html>
